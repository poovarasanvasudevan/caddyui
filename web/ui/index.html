<!doctype html>
<html lang="en">
  <head>
    <script>
      (function () {
        try {
          var theme = localStorage.getItem("caddyui-theme") || localStorage.getItem("theme") || "auto"
          var dark = theme === "dark" || ((theme === "auto" || theme === "system") && matchMedia("(prefers-color-scheme: dark)").matches)
          if (dark) document.documentElement.classList.add("dark")
          var hex = localStorage.getItem("primary-color") || "#3be8b0"
          function lum(h) {
            h = String(h).replace("#", "")
            if (h.length === 3) h = h.replace(/(.)/g, "$1$1")
            var n = parseInt(h, 16)
            if (!isFinite(n)) return 1
            var c = [(n >> 16) & 255, (n >> 8) & 255, n & 255].map(function (v) {
              v /= 255
              return v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4)
            })
            return 0.2126 * c[0] + 0.7152 * c[1] + 0.0722 * c[2]
          }
          var root = document.documentElement
          root.style.setProperty("--primary", hex)
          root.style.setProperty("--primary-foreground", lum(hex) > 0.4 ? "#10241c" : "#ffffff")
          if (localStorage.getItem("sidebar-collapsed") === "1") root.setAttribute("data-sidebar", "collapsed")
        } catch (e) {}
      })()
    </script>

  </body>
</html>
